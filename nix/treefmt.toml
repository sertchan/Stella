[global]
excludes = [
  "engine/target/**",
  "result*",
  "engine/Cargo.lock",
  "flake.lock",
  "LICENSE",
  "lists/**",
]

[formatter.nix]
command = "alejandra"
options = ["--quiet"]
includes = ["*.nix"]

[formatter.rust]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
