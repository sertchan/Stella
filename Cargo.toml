[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sertchan/stella"

[workspace.dependencies]
stella-core = { path = "crates/core" }
stella-dns = { path = "crates/dns" }
stella-net = { path = "crates/net" }
stella-probe = { path = "crates/probe" }
stella-sources = { path = "crates/sources" }
stella-apk = { path = "crates/apk" }
stella-crawl = { path = "crates/crawl" }
aho-corasick = "1"
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
httparse = "1"
memchr = "2"
rayon = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "http2",
  "gzip",
  "stream",
] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustc-hash = "2"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
tokio-tungstenite = "0.30"
x509-parser = "0.18"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
