[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sertchan/stella"

[workspace.dependencies]
stella-core = { path = "crates/core", version = "0.1.0" }
stella-dns = { path = "crates/dns", version = "0.1.0" }
stella-net = { path = "crates/net", version = "0.1.0" }
stella-probe = { path = "crates/probe", version = "0.1.0" }
stella-sources = { path = "crates/sources", version = "0.1.0" }
stella-apk = { path = "crates/apk", version = "0.1.0" }
stella-crawl = { path = "crates/crawl", version = "0.1.0" }
stella-testkit = { path = "crates/testkit", version = "0.1.0" }
aho-corasick = "1"
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
httparse = "1"
memchr = "2"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rayon = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "http2",
  "gzip",
  "stream",
] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustc-hash = "2"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
tokio-tungstenite = "0.30"
x509-parser = "0.18"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_iter_loop = "warn"
exit = "warn"
flat_map_option = "warn"
if_not_else = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
mem_forget = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
option_option = "warn"
panic = "warn"
print_stdout = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
todo = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unused_async = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
