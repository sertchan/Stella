name: CI

on:
  push:
    branches: ["ci/**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - id: list
        name: list flake checks
        run: echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.check }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: deps
        name: pick the cached dependency derivation
        env:
          CHECK: ${{ matrix.check }}
        run: |
          case "$CHECK" in
            build) deps=releaseDeps ;;
            clippy) deps=debugDeps ;;
            test) deps=measuredDeps ;;
            source-lint) deps=lintDeps ;;
            *) deps="" ;;
          esac
          echo "name=$deps" >> "$GITHUB_OUTPUT"
      - id: nix
        uses: ./.github/actions/nix
        with:
          deps: ${{ steps.deps.outputs.name }}
      - name: nix build .#checks.x86_64-linux.${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -o pipefail
          nix build --print-build-logs --no-link ".#checks.x86_64-linux.$CHECK" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: explain the failure
        if: failure()
        env:
          CHECK: ${{ matrix.check }}
        run: |
          log="$RUNNER_TEMP/build.log"
          why="$RUNNER_TEMP/why.txt"
          sed -E 's/^[A-Za-z0-9.+_-]+> //' "$log" | awk '/^error\[/ { on = 1 } on { print } on && /^$/ { on = 0 }' > "$why" || true
          [ -s "$why" ] || tail -n 80 "$log" > "$why"
          {
            echo "### $CHECK rejected this change"
            echo '```text'
            cat "$why"
            echo '```'
            echo "Run nix build .#checks.x86_64-linux.$CHECK or nix flake check to see the same report locally."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=$CHECK rejected this change::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$why")"
      - name: save the dependency derivation
        if: success() && steps.nix.outputs.key != '' && steps.nix.outputs.hit != 'true'
        env:
          DIR: ${{ steps.nix.outputs.dir }}
          STORE_PATH: ${{ steps.nix.outputs.path }}
        run: nix copy --to "file://$DIR?compression=zstd" "$STORE_PATH"
      - if: success() && steps.nix.outputs.key != '' && steps.nix.outputs.hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.nix.outputs.dir }}
          key: ${{ steps.nix.outputs.key }}
      - name: test and coverage summary
        if: always() && matrix.check == 'test'
        run: |
          nix build .#coverage -o coverage || exit 0
          row() { printf '%-12s %s\n' "$1" "$2"; }
          junit=coverage/junit.xml
          head=$(grep -o '<testsuites [^>]*>' "$junit")
          attr() { echo "$head" | grep -o " $1=\"[^\"]*\"" | cut -d'"' -f2; }
          {
            echo '```text'
            row tests "$(attr tests) run, $(attr failures) failed, $(attr skipped) skipped, $(attr time) s, nextest, dev profile with overflow checks"
            echo "  slowest"
            grep -o '<testcase [^>]*>' "$junit" |
              sed -E 's/.* name="([^"]*)" classname="([^"]*)".* time="([^"]*)".*/\3 \2 \1/' |
              sort -rn | head -5 |
              while read -r t c n; do printf '    %8s s  %-24s %s\n' "$t" "$c" "$n"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          totals=coverage/summary.json
          cell() { awk -v a="$1" -v b="$2" 'BEGIN { if (b == 0) printf "%13s %6s", "-", "-"; else printf "%13s %5.1f%%", a "/" b, a * 100 / b }'; }
          line() { printf '%-10s %s  %s  %s\n' "$1" "$(cell "$2" "$3")" "$(cell "$4" "$5")" "$(cell "$6" "$7")"; }
          {
            echo '```text'
            printf '%-10s %20s  %20s  %20s\n' crate lines functions regions
            jq -r '.data[0].files
              | group_by(.filename | capture("crates/(?<c>[^/]+)/").c)
              | map({
                  c: (.[0].filename | capture("crates/(?<c>[^/]+)/").c),
                  t: (map(.summary) | {
                    lc: (map(.lines.covered) | add), ln: (map(.lines.count) | add),
                    fc: (map(.functions.covered) | add), fn: (map(.functions.count) | add),
                    rc: (map(.regions.covered) | add), rn: (map(.regions.count) | add)
                  })
                })
              | sort_by(-(.t.lc / .t.ln))
              | .[]
              | [.c, .t.lc, .t.ln, .t.fc, .t.fn, .t.rc, .t.rn]
              | @tsv' "$totals" |
            while IFS=$'\t' read -r c a b d e f g; do line "$c" "$a" "$b" "$d" "$e" "$f" "$g"; done
            jq -r '.data[0].totals | ["total", .lines.covered, .lines.count, .functions.covered, .functions.count, .regions.covered, .regions.count] | @tsv' "$totals" |
            while IFS=$'\t' read -r c a b d e f g; do line "$c" "$a" "$b" "$d" "$e" "$f" "$g"; done
            echo
            echo "files with the most uncovered lines"
            jq -r '.data[0].files
              | map(select(.summary.lines.count > .summary.lines.covered))
              | sort_by(.summary.lines.covered - .summary.lines.count)
              | .[:12][]
              | [(.filename | sub(".*/crates/"; "")), .summary.lines.covered, .summary.lines.count, .summary.lines.percent]
              | @tsv' "$totals" |
            while IFS=$'\t' read -r f a b p; do printf '  %-36s %13s %5.1f%%\n' "$f" "$a/$b" "$p"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && matrix.check == 'test' && hashFiles('coverage/summary.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/report.txt

  commitlint:
    name: commitlint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: nix
        uses: ./.github/actions/nix
        with:
          deps: lintDeps
      - name: check every new commit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="origin/main..$AFTER"
          elif ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2> /dev/null; then
            echo "The push rewrote history, so every commit on the branch is checked."
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          nix run .#lint -- commits "$range"
      - name: check pull request title, which becomes the squash commit subject
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          nix run .#lint -- commit-msg "$RUNNER_TEMP/title"

  outdated:
    name: outdated
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: nix
        uses: ./.github/actions/nix
        with:
          deps: lintDeps
      - name: newest stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#lint -- outdated

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: cargo audit
        run: |
          status=0
          rows=""
          found=""
          for lock in Cargo.lock; do
            nix shell --inputs-from . nixpkgs#cargo nixpkgs#cargo-audit -c cargo audit --deny warnings --file "$lock" || status=1
            nix shell --inputs-from . nixpkgs#cargo nixpkgs#cargo-audit -c cargo audit --json --file "$lock" > audit.json || true
            db=$(jq -r '.database | "\(.["advisory-count"]) advisories, commit \(.["last-commit"]), updated \(.["last-updated"])"' audit.json)
            rows+=$(jq -r --arg lock "$lock" '[$lock, .lockfile["dependency-count"], .vulnerabilities.count, ([.warnings[]? | length] | add // 0)] | @tsv' audit.json)$'\n'
            found+=$(jq -r --arg lock "$lock" '
              ((.vulnerabilities.list // [])[] | [$lock, "vulnerability", .advisory.id, "\(.package.name) \(.package.version)", .advisory.title]),
              ((.warnings // {}) | to_entries[] | .key as $k | .value[] | [$lock, $k, (.advisory.id // "-"), "\(.package.name) \(.package.version)", (.advisory.title // "")])
              | @tsv' audit.json)
            [ -n "$found" ] && found+=$'\n'
          done
          {
            echo '```text'
            printf '%-12s %s\n' database "$db"
            echo
            printf '%-16s %7s %16s %9s\n' lockfile crates vulnerabilities warnings
            printf '%s' "$rows" | while IFS=$'\t' read -r l c v w; do printf '%-16s %7s %16s %9s\n' "$l" "$c" "$v" "$w"; done
            if [ -n "$found" ]; then
              echo
              printf '%s' "$found" | while IFS=$'\t' read -r l k id p t; do printf '%-16s %-13s %-18s %-24s %s\n' "$l" "$k" "$id" "$p" "$t"; done
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  ci-success:
    name: ci-success
    if: always()
    needs: [plan, check, commitlint, outdated, cargo-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=0
          {
            echo '```text'
            printf '%-14s %s\n' job result
            while read -r job result; do
              ok=no
              if [ "$result" = success ]; then
                ok=yes
              elif [ "$result" = skipped ] && [ "$job" = commitlint ] && [ "$EVENT" != push ] && [ "$EVENT" != pull_request ]; then
                ok=yes
              fi
              printf '%-14s %s\n' "$job" "$result"
              if [ "$ok" = no ]; then
                failed=1
                echo "::error title=$job did not pass::The $job job ended with $result. Open $RUN, select $job and read its summary: every rejection names the rule, what was found, what is expected, why the rule exists and how to fix it."
              fi
            done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
            echo '```'
            if [ "$failed" -ne 0 ]; then
              echo "This change is rejected. Every job above must pass before it can land on main."
              echo "Each failed job explains why in its own summary and in the annotations on the pull request."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
