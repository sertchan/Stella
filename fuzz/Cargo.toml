[package]
name = "stella-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
stella-dns = { path = "../crates/dns" }
stella-net = { path = "../crates/net" }
tokio = { version = "1", features = ["rt", "io-util"] }

[workspace]

[[bin]]
name = "dns_parse"
path = "fuzz_targets/dns_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_reply"
path = "fuzz_targets/http_reply.rs"
test = false
doc = false
bench = false
